<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>飞书待办 · 助手控制台</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#17233d;background:#f3f6fb;color-scheme:light}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:56px auto;padding:0 24px}.eyebrow{color:#596b8b;font-size:13px;letter-spacing:1px}h1{font-size:30px;letter-spacing:-.7px;margin:12px 0}header p{color:#66728a;line-height:1.8;margin:0 0 26px}.panel{background:#fff;border:1px solid #e3e9f2;border-radius:20px;box-shadow:0 12px 35px #182c4a08;padding:28px}.status-line{display:flex;align-items:center;gap:12px}.dot{width:12px;height:12px;border-radius:50%;background:#9aa5b7}.on .dot{background:#22a675;box-shadow:0 0 0 6px #e9f8f0}.status{font-size:24px;font-weight:650}.description{margin:14px 0 24px;line-height:1.8;color:#66728a;min-height:52px}.buttons{display:flex;gap:12px}button{font:inherit;font-weight:600;border-radius:10px;padding:13px 24px;border:1px solid #dce3ed;background:#fff;color:#33435d;cursor:pointer;min-height:48px}button.primary{background:#2864ec;border-color:#2864ec;color:white}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #97baff;outline-offset:3px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;border-top:1px solid #edf0f5;margin-top:26px;padding-top:8px}.fact{padding:18px 0 2px}.label{font-size:12px;color:#8090a7;margin-bottom:7px}.value{font-size:14px;color:#35465f;line-height:1.6}.notice{margin:20px 0 0;padding:13px 15px;background:#f5f8ff;border-radius:10px;font-size:13px;line-height:1.8;color:#506686}.error{background:#fff3ee;color:#a64c2c}.links{display:flex;gap:20px;margin-top:24px}a{color:#2864ec;text-decoration:none;font-size:14px}.footer{font-size:12px;line-height:1.9;color:#8793a7;margin:20px 2px}.muted{color:#8793a7} @media(max-width:560px){main{margin:28px auto;padding:0 16px}.panel{padding:22px}.buttons{flex-direction:column}.facts{grid-template-columns:1fr}h1{font-size:26px}}
</style></head><body><main>
<header><div class="eyebrow">我的工作待办 · 本机个人控制台</div><h1>让助手按你的需要运行</h1><p>自己开启或关闭。待办、表格和历史记录始终保留。</p></header>
<section class="panel" aria-label="助手开关">
<div class="status-line" id="stateRow"><span class="dot"></span><span class="status" id="stateText">正在读取状态…</span></div>
<p class="description" id="description">正在连接你自己的待办助手。</p>
<div class="buttons"><button class="primary" id="enable" disabled>开启助手</button><button id="disable" disabled>关闭助手</button></div>
<div class="facts"><div class="fact"><div class="label">使用者</div><div class="value" id="owner">—</div></div><div class="fact"><div class="label">卡片保存连接</div><div class="value" id="receiver">—</div></div><div class="fact"><div class="label">每日通知配置</div><div class="value" id="schedule">—</div></div><div class="fact"><div class="label">规则版本 / 程序版本</div><div class="value" id="version">—</div></div></div>
<div class="notice" id="notice" role="status">关闭后停止新扫描、通知发送与勾选保存；已发出的消息仍保留。</div>
<div class="links"><a id="base" target="_blank" rel="noreferrer" hidden>查看我的待办表</a><a id="dashboard" target="_blank" rel="noreferrer" hidden>查看我的仪表盘</a></div>
</section><p class="footer">此入口只控制这台电脑上的个人安装。关闭网页不会关闭助手。<br>原定时任务可能仍会唤起，但关闭状态直接跳过；如需停止唤起，可在所用AI客户端暂停任务。<br>开启不会自动创建定时任务；首次授权、卡片提交和定时配置仍须完成验证。</p>
</main><script>
const token=location.hash.slice(1)||sessionStorage.getItem('todo-control-token')||'';if(token)sessionStorage.setItem('todo-control-token',token);history.replaceState(null,'',location.pathname);let busy=false;
const el=id=>document.getElementById(id);const headers={'X-Control-Token':token};
async function api(path,options={}){const r=await fetch(path,{...options,headers:{...headers,...options.headers}});const value=await r.json();if(!r.ok)throw Error(value.error||'无法读取本机状态');return value;}
function show(s){el('stateRow').classList.toggle('on',s.enabled&&s.initialized);el('stateText').textContent=!s.initialized?'尚未初始化':s.enabled?'助手已开启':'助手已关闭';el('description').textContent=!s.initialized?'先将安装包交给AI，完成你自己的飞书授权与初始化，再回到这里开启。':s.enabled?'按已配置的计划整理和提醒；你可以随时关闭。':'停止新扫描、通知和卡片保存。重新开启后继续使用原有待办。';el('owner').textContent=s.owner_name||'尚未绑定本人账号';el('receiver').textContent=s.receiver_connected?(s.enabled?'已连接':'仍在连接，请重试关闭'):s.enabled?'未连接 / 正在连接':'已关闭';el('schedule').textContent=s.schedule_registered?'已登记，请在所用AI客户端核验运行状态':'尚未登记，需要先完成定时配置';el('version').textContent=s.config_version+' / '+s.client_version;el('enable').disabled=busy||!s.initialized||(s.enabled&&s.receiver_connected);el('disable').disabled=busy||(!s.enabled&&!s.receiver_connected);for(const id of ['base','dashboard']){const url=s[id+'_url'];el(id).hidden=!url;if(url)el(id).href=url;}if(s.switch_error)message(s.switch_error,true);}
function message(text,error=false){el('notice').textContent=text;el('notice').classList.toggle('error',error);}
async function refresh(){if(busy)return;try{show(await api('/api/status'));}catch(e){el('enable').disabled=el('disable').disabled=true;message(e.message+'。请重新双击桌面入口打开。',true);}}
async function change(enabled){busy=true;el('enable').disabled=el('disable').disabled=true;message(enabled?'正在开启并检查接收端…':'正在关闭助手，保留全部记录…');try{const result=await api('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled})});busy=false;show(result.status);message(result.message+(result.detail?' '+result.detail:''),!result.ok);}catch(e){busy=false;message(e.message,true);await refresh();}}
el('enable').onclick=()=>change(true);el('disable').onclick=()=>change(false);refresh();setInterval(refresh,3000);
</script></body></html>
